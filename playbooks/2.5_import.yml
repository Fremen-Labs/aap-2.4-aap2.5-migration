- name: Import Configuration Into AAP 2.5
  hosts: localhost
  connection: local
  gather_facts: false
  collections: [ infra.aap_configuration ]
  vars:
    controller_hostname: "{{ lookup('vars', 'aap25_host') }}"
    controller_oauthtoken: "{{ lookup('env','AAP25_TOKEN') }}"
    controller_validate_certs: "{{ aap25_validate_certs | default(true) }}"
    cac_dir: "{{ playbook_dir }}/../_cac_25"

    controller_organizations: >-
      {{ (lookup('file', cac_dir ~ '/controller_organizations.yml') | from_yaml).controller_organizations | default([]) }}
    controller_execution_environments: >-
      {{ (lookup('file', cac_dir ~ '/controller_execution_environments.yml')| from_yaml).controller_execution_environments | default([]) }}
    controller_projects: >-
      {{ (lookup('file', cac_dir ~ '/controller_projects.yml') | from_yaml).controller_projects | default([]) }}
    controller_credentials: >-
      {{ (lookup('file', cac_dir ~ '/controller_credentials.yml') | from_yaml).controller_credentials | default([]) }}
    controller_inventories: >-
      {{ (lookup('file', cac_dir ~ '/controller_inventories.yml') | from_yaml).controller_inventories | default([]) }}
    controller_hosts: >-
      {{ (lookup('file', cac_dir ~ '/controller_hosts.yml') | from_yaml).controller_hosts | default([]) }}
    controller_inventory_sources: >-
      {{ (lookup('file', cac_dir ~ '/controller_inventory_sources.yml') | from_yaml).controller_inventory_sources | default([]) }}
    controller_job_templates: >-
      {{ (lookup('file', cac_dir ~ '/controller_job_templates.yml') | from_yaml).controller_job_templates | default([]) }}
    controller_workflow_job_templates: >-
      {{ (lookup('file', cac_dir ~ '/controller_workflow_job_templates.yml') | from_yaml).controller_workflow_job_templates | default([]) }}
    controller_teams: >-
      {{ (lookup('file', cac_dir ~ '/controller_teams.yml') | from_yaml).controller_teams | default([]) }}
    controller_users: >-
      {{ (lookup('file', cac_dir ~ '/controller_users.yml') | from_yaml).controller_users | default([]) }}

    controller_configuration_collect_logs: true

  tasks:
    - import_role: { name: controller_organizations }
    - import_role: { name: controller_execution_environments }
    - import_role: { name: controller_projects }
    - import_role: { name: controller_credentials }
    - import_role: { name: controller_inventories }
    - import_role: { name: controller_hosts }
    - import_role: { name: controller_inventory_sources }
    - import_role: { name: controller_job_templates }
    - import_role: { name: controller_workflow_job_templates }
    - import_role: { name: controller_teams }
    - import_role: { name: controller_users }


    # Alternative once comfortable:
    # - import_role: { name: dispatch }