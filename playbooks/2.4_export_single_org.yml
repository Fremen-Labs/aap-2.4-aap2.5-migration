- name: Export AAP 2.4 - Single Organization Only (Basic Auth, URI)
  hosts: localhost
  connection: local
  gather_facts: false
  collections: [ ansible.controller ] # Not really needed, but kept here as a ref

  vars:
    export_org_name: "INSERT_YOUR_ORG_NAME_HERE"
    controller_hostname: "{{ lookup('vars', 'aap24_host') }}"
    controller_validate_certs: "{{ aap24_validate_certs | default(true) }}"
    controller_username: "{{ lookup('env','AAP24_USERNAME') }}"
    controller_password: "{{ lookup('env','AAP24_PASSWORD') }}"
    export_dir: "{{ playbook_dir }}/../_export_24"
    page_size: 200
    debug_mode: true

    # Resources that are GLOBAL no org filter
    global_resources:
      - credential_types

    # Resources that should be filtered by org
    org_scoped_resources:
      - organizations            # Single org by name
      - credentials
      - projects
      - inventories
      - job_templates
      - workflow_job_templates
      - execution_environments
      # - teams
      # - users
      # - inventory_sources
      # - applications
      # - notification_templates
      # - schedules

  tasks:
    # ---------- PREFLIGHT ----------
    - name: Fail Fast If Username/Password Are Not Provided
      ansible.builtin.fail:
        msg: "AAP24_USERNAME / AAP24_PASSWORD must be set in the environment."
      when: controller_username is omit or controller_password is omit

    - name: Ensure Export Directory Exists
      ansible.builtin.file:
        path: "{{ export_dir }}"
        state: directory
        mode: "0755"

    - name: Set API Base URL Fact
      ansible.builtin.set_fact:
        api_base: "{{ (controller_hostname | regex_replace('/+$','')) ~ '/api/v2' }}"

    # ---------- ORG LOOKUP ----------
    - name: Lookup Organization By Name (Get ID)
      ansible.builtin.uri:
        url: "{{ api_base }}/organizations/?name={{ export_org_name | urlencode }}"
        method: GET
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
        return_content: true
        force_basic_auth: true
      register: org_lookup

    - name: Fail If Organization Not Found
      ansible.builtin.fail:
        msg: "Organization '{{ export_org_name }}' NOT FOUND ON {{ controller_hostname }}"
      when: "(org_lookup.json.count | default(0)) | int == 0"

    - name: Set Organization ID Fact
      ansible.builtin.set_fact:
        export_org_id: "{{ org_lookup.json.results[0].id }}"

    # ---------- GLOBAL RESOURCES NO ORG FILTER ----------
    - name: Export Global Resources To JSON (Via API)
      vars:
        resource: "{{ item }}"
      loop: "{{ global_resources }}"
      loop_control:
        label: "{{ item }}"
      block:
        - name: Fetch Global Resource Pages
          block:
            - name: GET Global Resource Page
              ansible.builtin.uri:
                url: "{{ api_base }}/{{ resource }}/?page_size={{ page_size }}"
                method: GET
                url_username: "{{ controller_username }}"
                url_password: "{{ controller_password }}"
                validate_certs: "{{ controller_validate_certs }}"
                return_content: true
                force_basic_auth: true
              register: global_page
            
            - name: Print Page From GET Global Resource Page Task
              ansible.builtin.debug:
                msg:
                  resource: "{{ resource }}"
                  count: "{{ global_page.json.count | default('no count field') }}"
                  json_keys: "{{ global_page.json | list }}"
                  full_json: "{{ global_page.json | to_nice_json | split('\n') | map('regex_replace', '\\\\', '') | list }}"
              when: debug_mode | bool

        - name: Write Global Resource Export File
          ansible.builtin.copy:
            content: "{{ global_page.json.results | default([]) | to_nice_json }}"
            dest: "{{ export_dir }}/{{ resource }}.json"

    # ---------- ORGANIZATIONS SINGLE RECORD BY NAME ----------
    - name: Write Organizations.json For Single Org
      ansible.builtin.copy:
        content: "{{ org_lookup.json.results | to_nice_json }}"
        dest: "{{ export_dir }}/organizations.json"

    # ---------- ORG-SCOPED RESOURCES FILTERED BY ORG ID ----------
    - name: Export Org-Scoped Resources Filtered By Organization ID Via API
      vars:
        resource: "{{ org_resource }}"
      loop: "{{ org_scoped_resources }}"
      loop_control:
        loop_var: org_resource
        label: "{{ org_resource }}"
      when: org_resource != 'organizations'
      block:
        - name: GET Org-Scoped Resource List
          ansible.builtin.uri:
            url: "{{ api_base }}/{{ resource }}/?organization={{ export_org_id }}&page_size={{ page_size }}"
            method: GET
            url_username: "{{ controller_username }}"
            url_password: "{{ controller_password }}"
            force_basic_auth: true
            validate_certs: "{{ controller_validate_certs }}"
            return_content: true
          register: org_page

        - name: Debug Org-Scoped Resource Response
          ansible.builtin.debug:
            msg:
              resource: "{{ resource }}"
              count: "{{ org_page.json.count | default('no count field') }}"
              json_keys: "{{ org_page.json.keys() | list }}"
              full_json: "{{ org_page.json | to_nice_json }}"
          when: debug_mode | bool

        - name: Write Org-Scoped Export File
          ansible.builtin.copy:
            content: "{{ (org_page.json.results | default([])) | to_nice_json }}"
            dest: "{{ export_dir }}/{{ resource }}.json"